<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2027 대입 6월 분석</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
    background: #f0f7ff;
    color: #1a2a3a;
    min-height: 100vh;
    line-height: 1.7;
  }

  header {
    background: linear-gradient(135deg, #0369a1 0%, #0ea5e9 100%);
    color: white;
    text-align: center;
    padding: 40px 24px 32px;
  }
  .back { display: inline-block; margin-bottom: 16px; font-size: 13px; color: rgba(255,255,255,0.7); text-decoration: none; }
  .back:hover { color: white; }
  header h1 { font-size: 24px; font-weight: 700; margin-bottom: 6px; }
  header p  { font-size: 13px; color: rgba(255,255,255,0.8); }

  .refresh-btn {
    display: inline-flex; align-items: center; gap: 6px;
    margin-top: 14px; padding: 8px 20px;
    background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.4);
    border-radius: 20px; color: rgba(255,255,255,0.92); font-size: 13px;
    font-family: inherit; cursor: pointer; transition: background 0.15s;
  }
  .refresh-btn:hover  { background: rgba(255,255,255,0.3); }
  .refresh-btn:disabled { opacity: 0.6; cursor: default; }
  .refresh-btn.spinning .spin { display: inline-block; animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  #status-bar {
    margin-top: 8px; font-size: 12px;
    color: rgba(255,255,255,0.75); min-height: 18px;
  }

  main { max-width: 740px; margin: 0 auto; padding: 32px 20px 80px; }

  /* 안내 */
  .guide-box {
    background: #E0F2FE; border: 1px solid #BAE6FD;
    border-radius: 12px; padding: 14px 18px; margin-bottom: 28px;
    font-size: 13px; color: #0369a1;
    display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-start;
  }
  .guide-tags { display: flex; gap: 6px; flex-wrap: wrap; }

  /* 섹션 레이블 */
  .section-label {
    font-size: 12px; font-weight: 700; color: #0369a1;
    letter-spacing: 1px; text-transform: uppercase;
    margin: 36px 0 14px;
    display: flex; align-items: center; gap: 8px;
  }
  .section-label::after { content: ''; flex: 1; height: 1px; background: #BAE6FD; }
  .section-meta { font-size: 11px; font-weight: 400; color: #94a3b8; text-transform: none; letter-spacing: 0; }

  /* 태그 */
  .tag {
    display: inline-block; border-radius: 6px;
    padding: 2px 8px; font-size: 11px; font-weight: 600;
  }
  .tag-통계  { background: #dbeafe; color: #1d4ed8; }
  .tag-분석  { background: #ede9fe; color: #5b21b6; }
  .tag-유리  { background: #dcfce7; color: #166534; }
  .tag-불리  { background: #fee2e2; color: #991b1b; }
  .tag-결정  { background: #fef9c3; color: #854d0e; }

  /* 뉴스 카드 */
  .news-card {
    background: white; border: 1px solid #BAE6FD;
    border-radius: 14px; padding: 18px 20px; margin-bottom: 12px;
  }
  .news-meta { display: flex; align-items: center; gap: 7px; margin-bottom: 8px; flex-wrap: wrap; }
  .news-date { font-size: 11px; color: #64748b; background: #f1f5f9; border-radius: 5px; padding: 2px 7px; }
  .news-title { font-size: 14.5px; font-weight: 700; color: #0f172a; margin-bottom: 7px; }
  .news-body  { font-size: 13px; color: #334155; margin-bottom: 8px; }
  .news-source { font-size: 11px; color: #1D9E75; text-decoration: none; }
  .news-source:hover { text-decoration: underline; }

  /* 고민 포인트 카드 */
  .point-card {
    background: white; border: 1px solid #BAE6FD;
    border-radius: 14px; padding: 18px 20px; margin-bottom: 12px;
  }
  .point-q {
    font-size: 15px; font-weight: 700; color: #0f172a;
    margin-bottom: 10px; display: flex; align-items: flex-start; gap: 8px;
  }
  .point-q .q-icon { font-size: 18px; flex-shrink: 0; margin-top: 1px; }
  .point-basis { font-size: 12.5px; color: #475569; margin-bottom: 10px; padding-left: 26px; }
  .point-verdict {
    display: inline-flex; align-items: center; gap: 6px;
    margin-left: 26px; padding: 5px 14px; border-radius: 20px;
    font-size: 12px; font-weight: 700;
  }
  .verdict-유리          { background: #dcfce7; color: #166534; }
  .verdict-불리          { background: #fee2e2; color: #991b1b; }
  .verdict-상황에따라다름 { background: #fef9c3; color: #854d0e; }
  .point-reason {
    font-size: 12px; color: #64748b; margin-top: 8px;
    padding: 8px 12px 8px 26px; border-left: 3px solid #BAE6FD;
    margin-left: 12px;
  }

  /* 로딩 스켈레톤 */
  .skeleton { border-radius: 8px; background: #e2e8f0; animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  /* 에러 */
  .error-box {
    background: #fff1f2; border: 1px solid #fecdd3;
    border-radius: 12px; padding: 14px 18px; color: #9f1239; font-size: 13px;
  }

  .updated { text-align: right; font-size: 11px; color: #94a3b8; margin-top: 36px; }
</style>
</head>
<body>

<header>
  <a href="/민준입시.html" class="back">← 민준 입시 자료로</a>
  <h1>📊 2027 대입 — 6월 분석</h1>
  <p>민준이 (2027학년도 수능 · 2026.11.19) · 6월 뉴스 기반 통계·유불리 분석</p>
  <button class="refresh-btn" id="refresh-btn" onclick="doRefresh()">
    <span class="spin">↻</span> 6월 뉴스 재조사
  </button>
  <div id="status-bar"></div>
</header>

<main>
  <div class="guide-box">
    <span style="font-size:18px;flex-shrink:0">ℹ️</span>
    <div>
      <div style="margin-bottom:6px;font-weight:600">분석 기준 · 태그 안내</div>
      <div class="guide-tags">
        <span class="tag tag-통계">통계</span> 수치·비율·데이터
        <span class="tag tag-분석">분석</span> 전문가·학원 해석
        <span class="tag tag-유리">유리</span> 유리한 전략
        <span class="tag tag-불리">불리</span> 불리한 상황
        <span class="tag tag-결정">결정</span> 지금 결정 필요
      </div>
    </div>
  </div>

  <!-- 뉴스 섹션 -->
  <div class="section-label">
    📋 6월 분석 뉴스
    <span class="section-meta" id="news-meta"></span>
  </div>
  <div id="news-section"></div>

  <!-- 고민 포인트 섹션 -->
  <div class="section-label">
    🎯 입시 고민 포인트
    <span class="section-meta" id="points-meta"></span>
  </div>
  <div id="points-section"></div>

  <p class="updated" id="updated-line">페이지 기준일: 2026년 6월 10일</p>
</main>

<script>
const TAG_CLASS = {
  '통계': 'tag-통계', '분석': 'tag-분석',
  '유리': 'tag-유리', '불리': 'tag-불리', '결정': 'tag-결정'
}
const VERDICT_CLASS = {
  '유리': 'verdict-유리', '불리': 'verdict-불리', '상황에 따라 다름': 'verdict-상황에따라다름'
}

function fmtDate(iso) {
  try {
    const d = new Date(iso)
    return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`
  } catch { return '' }
}

function renderTags(tags) {
  return (tags || []).map(t => `<span class="tag ${TAG_CLASS[t] || 'tag-분석'}">${t}</span>`).join(' ')
}

function renderNews(items) {
  if (!items || !items.length)
    return '<div class="error-box">분석 가능한 뉴스가 없습니다. 잠시 후 다시 시도해주세요.</div>'
  return items.map(n => `
<div class="news-card">
  <div class="news-meta">
    <span class="news-date">${n.date || ''}</span>
    ${renderTags(n.tags)}
  </div>
  <div class="news-title">${n.title || ''}</div>
  <div class="news-body">${n.body || ''}</div>
  ${n.sourceUrl
    ? `<a href="${n.sourceUrl}" class="news-source" target="_blank">↗ ${n.sourceTitle || n.sourceUrl}</a>`
    : (n.sourceTitle ? `<span class="news-source">${n.sourceTitle}</span>` : '')
  }
</div>`).join('')
}

function renderPoints(items) {
  if (!items || !items.length) return ''
  return items.map(p => {
    const vc = VERDICT_CLASS[p.verdict] || 'verdict-상황에따라다름'
    const verdictLabel = p.verdict || '상황에 따라 다름'
    return `
<div class="point-card">
  <div class="point-q">
    <span class="q-icon">🤔</span>
    <span>${p.question || ''}</span>
  </div>
  <div class="point-basis">📌 근거: ${p.basis || ''}</div>
  <span class="point-verdict ${vc}">▶ ${verdictLabel}</span>
  <div class="point-reason">${p.reason || ''}</div>
</div>`
  }).join('')
}

function showSkeleton(id, count = 3) {
  document.getElementById(id).innerHTML = Array.from({length: count}, (_, i) => `
<div class="news-card" style="opacity:0.5">
  <div class="skeleton" style="height:12px;width:40%;margin-bottom:10px"></div>
  <div class="skeleton" style="height:16px;width:85%;margin-bottom:8px"></div>
  <div class="skeleton" style="height:12px;width:100%;margin-bottom:4px"></div>
  <div class="skeleton" style="height:12px;width:70%"></div>
</div>`).join('')
}

async function doRefresh() {
  const btn = document.getElementById('refresh-btn')
  const statusEl = document.getElementById('status-bar')
  btn.disabled = true
  btn.classList.add('spinning')
  statusEl.textContent = '6월 뉴스 수집 중…'

  showSkeleton('news-section', 4)
  showSkeleton('points-section', 2)

  try {
    const res = await fetch('/api/admission-news')
    if (!res.ok) throw new Error(`서버 오류 ${res.status}`)
    const data = await res.json()
    if (data.error) throw new Error(data.error)

    const period = `6월 1일 ~ ${fmtDate(data.fetchedAt)} · ${data.rawCount}건 수집`
    document.getElementById('news-meta').textContent = period
    document.getElementById('points-meta').textContent = fmtDate(data.fetchedAt) + ' 기준'

    document.getElementById('news-section').innerHTML   = renderNews(data.news)
    document.getElementById('points-section').innerHTML = renderPoints(data.points)

    const providerLabel = data.provider ? ` (분석: ${data.provider})` : ''
    statusEl.textContent = data.summary ? `✓ ${data.summary}${providerLabel}` : `✓ ${fmtDate(data.fetchedAt)} 업데이트 완료${providerLabel}`
    document.getElementById('updated-line').textContent = `마지막 업데이트: ${fmtDate(data.fetchedAt)}`
  } catch (e) {
    document.getElementById('news-section').innerHTML   = `<div class="error-box">오류: ${e.message}</div>`
    document.getElementById('points-section').innerHTML = ''
    statusEl.textContent = `오류: ${e.message}`
  } finally {
    btn.disabled = false
    btn.classList.remove('spinning')
  }
}

// 초기 로드
window.addEventListener('DOMContentLoaded', () => {
  document.getElementById('news-section').innerHTML   = renderNews(INIT_NEWS)
  document.getElementById('points-section').innerHTML = renderPoints(INIT_POINTS)
})
</script>
